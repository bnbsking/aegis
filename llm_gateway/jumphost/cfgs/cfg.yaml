llm_chat_cfg:
  google:
    mod_name: google
    cls_name: GoogleChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gemini-3.5-flash"

  openai:
    mod_name: openai
    cls_name: OpenAIChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gpt-4o-mini"
  
  azure_openai:
    mod_name: azure_openai
    cls_name: AzureOpenAIChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gpt-4.1-mini"
  
  aws:
    mod_name: aws
    cls_name: AWSChatAPI
    args:
      profile_name: emc-ai-poc
      region_name: ap-southeast-1
      model_name: "global.anthropic.claude-opus-4-5-20251101-v1:0"
      # "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      # "global.anthropic.claude-sonnet-4-6"
      # "global.anthropic.claude-opus-4-5-20251101-v1:0"


response_format_preprocess:
  openai: schema_to_model
  azure_openai: schema_to_model
