[project]
name = "llm-client"
version = "0.1.0"
description = ""
authors = [
    {name = "james"}
]
readme = "README.md"
requires-python = "<3.14,>=3.11"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "openai (>=2.44.0,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-core (>=1.4.8,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
google = [
    "google-genai (>=2.10.0,<3.0.0)"
]

[project.optional-dependencies]
google = [
    "google-genai (>=2.10.0,<3.0.0)"
]
