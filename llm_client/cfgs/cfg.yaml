llm_chat_cfg:
  ollama:
    mod_name: ollama
    cls_name: OllamaChat
    args:
      model_name: "qwen3:0.6b"
      base_url: "http://172.18.53.104:11434/api/generate"

  vllm:
    mod_name: vllm
    cls_name: VLLMChat
    args:
      model_name: "qwen3:0.6b"
      base_url: "http://172.18.53.104:8106/v1"

  google:
    mod_name: google
    cls_name: GoogleChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gemini-3.5-flash-lite"

  openai:
    mod_name: openai
    cls_name: OpenAIChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gpt-5-nano"
  
  azure_openai:
    mod_name: azure_openai
    cls_name: AzureOpenAIChatAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gpt-5.4-mini"
  
  aws:
    mod_name: aws
    cls_name: AWSChatAPI
    args:
      profile_name: emc-ai-poc
      region_name: ap-southeast-1
      model_name: global.anthropic.claude-haiku-4-5-20251001-v1:0


llm_emb_cfg:
  ollama:
    mod_name: ollama
    cls_name: OllamaEmbedding
    args:
      model_name: "qwen3-embedding:0.6b"
      base_url: "http://172.18.53.104:11434/api/embed"
  
  vllm:
    mod_name: vllm
    cls_name: VLLMEmbedding
    args:
      model_name: "qwen3-embedding:0.6b"
      base_url: "http://172.18.53.104:8106/v1"
  
  google:
    mod_name: google
    cls_name: GoogleEmbeddingAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "gemini-embedding-001"
  
  openai:
    mod_name: openai
    cls_name: OpenAIEmbeddingAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "text-embedding-3-small"

  azure_openai:
    mod_name: azure_openai
    cls_name: AzureOpenAIEmbeddingAPI
    args:
      api_key: /app/cfgs/api_keys.yaml
      model_name: "text-embedding-3-small"
